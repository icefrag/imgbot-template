[project]
name = "icefrag"
version = "0.3.0"
description = "图色脚本脚手架框架(薄项目模型): 中控台/热键收编/DSL/异常重开全包, 业务只写 task.py+business.py"
requires-python = ">=3.12"
dependencies = [
    "imgbot[ocr]",
    "ttkbootstrap>=1.10.1",
    "tomli-w>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["icefrag"]

[tool.uv.sources]
imgbot = { path = "../imgbot", editable = true }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
# 腾讯镜像该路径已整体下线(404);南大镜像按构建号分目录, 与 uv 下载布局一致
python-install-mirror = "https://mirror.nju.edu.cn/github-release/astral-sh/python-build-standalone"
