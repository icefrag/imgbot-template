<h1><code>find_all</code></h1>
<p>单帧找全部同类图(列表项/多目标), 近邻去重。单个命中用大漠直通 FindPic。</p>
<h2>原型</h2>
<pre>find_all(pic, region=None, threshold=None)</pre>

<h2>示例</h2>
<pre>for x, y in find_all("小地图图标.png"): click(x, y)</pre>
