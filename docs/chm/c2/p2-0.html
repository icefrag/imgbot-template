<h1><code>find_color</code></h1>
<p>区域找全部色块。color="RRGGBB"(偏差给 tol, 或写 "RRGGBB-DRDGDB")。</p>
<h2>原型</h2>
<pre>find_color(color, region=None, tol=0)</pre>

<h2>示例</h2>
<pre>hit = find_color("CC3333", tol=40, region=(0, 0, 900, 570))
if hit: click(*hit[0])</pre>
