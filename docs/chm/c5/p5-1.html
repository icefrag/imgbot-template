<h1><code>ocr_numbers</code></h1>
<p>识数: OCR 全文后抠所有数字串(等级取 [0], 坐标取 [:2]); 没识到返回 []。</p>
<h2>原型</h2>
<pre>ocr_numbers(region=None)</pre>
小字体数字不准时缩 region, 或走 ctx.ops.read_number 字模重武器。
<h2>示例</h2>
<pre>nums = ocr_numbers(region=(50, 580, 200, 610))
lv = nums[0] if nums else 0          # 等级
# 坐标场景: x, y = ocr_numbers(POS_RECT)[:2]</pre>
