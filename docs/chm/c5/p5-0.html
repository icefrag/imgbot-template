<h1><code>ocr</code></h1>
<p>识字: OCR 读区域全文, 行间空格连接("任务名叫什么"用这个)。</p>
<h2>原型</h2>
<pre>ocr(region=None, fast=False)</pre>
fast=True 走快引擎: 只给"大字窄条"场景(板面标题行), 小字会漏读。
<h2>示例</h2>
<pre>task = ocr(region=(10, 30, 400, 60))          # 识全文: "每日签到 副本"
if "签到" in task: ...          # 任务名判断</pre>
</body></html>
