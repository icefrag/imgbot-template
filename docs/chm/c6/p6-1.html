<h1><code>at</code></h1>
<p>期望验证: 当前是否在指定界面(单帧一张锚点, 高频便宜; 迷路判别用 go)。</p>
<h2>原型</h2>
<pre>at(name)</pre>

<h2>示例</h2>
<pre>if at("city"): ...                  # 便宜的单帧"我在不在这屏"</pre>
