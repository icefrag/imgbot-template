<h1><code>progress</code></h1>
<p>手动打一次进展点(看门狗信号; find/wait 命中与点击已自动打点)。</p>
<h2>原型</h2>
<pre>progress(note='')</pre>
长轮询循环里打点, 防无进展看门狗误杀。
<h2>示例</h2>
<pre>while not ctx.stop.is_set():
    progress("等刷新")          # 长轮询手动打点, 防看门狗误杀
    sleep(2000)</pre>
</body></html>
