<h1><code>dblclick</code></h1>
<p>双击 (x, y), 参数同 click; adb 端两击带 80~120ms 间隔。</p>
<h2>原型</h2>
<pre>dblclick(x, y, jitter=None, human=None, settle=None)</pre>

<h2>示例</h2>
<pre>dblclick(400, 300)</pre>
