<h1><code>sleep</code></h1>
<p>可中断睡眠: F9 按下立刻醒(代替 time.sleep 的傻等)。</p>
<h2>原型</h2>
<pre>sleep(ms)</pre>
ms 给区间则每次取随机: sleep((400, 900)) —— 固定间隔是检测特征。
<h2>示例</h2>
<pre>sleep(500)                            # 半秒, F9 按下立刻醒</pre>
