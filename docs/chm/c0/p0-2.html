<h1><code>drag</code></h1>
<p>按住拖拽(列表滚动/滑块): window=按住左键插值拖, adb=原生 swipe。</p>
<h2>原型</h2>
<pre>drag(x1, y1, x2, y2, ms=350)</pre>

<h2>示例</h2>
<pre>drag(450, 550, 450, 150)               # 列表上滑(按住拖)
drag(100, 300, 500, 300, ms=500)       # 横拖, 500ms</pre>
</body></html>
