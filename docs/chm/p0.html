<html><head><meta charset='utf-8'><style>body{font-family:'Microsoft YaHei';margin:24px;line-height:1.6}pre{background:#1b1f24;color:#d0d0d0;padding:10px;border-radius:6px;overflow-x:auto}h2{border-bottom:2px solid #4a7;padding-bottom:4px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 10px;font-size:14px}</style></head><body><h1>1. 初始化环境</h1><p>装一次, 以后所有项目通用:</p>
<li><b>uv</b>(包管理器): <code>pip install uv -i https://pypi.tuna.tsinghua.edu.cn/simple</code></li>
<li>已装 <b>Python 3.12+</b> 的话 uv 直接用它, 不再下载;</li>
