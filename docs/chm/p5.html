<html><head><meta charset='utf-8'><style>body{font-family:'Microsoft YaHei';margin:24px;line-height:1.6}pre{background:#1b1f24;color:#d0d0d0;padding:10px;border-radius:6px;overflow-x:auto}h2{border-bottom:2px solid #4a7;padding-bottom:4px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 10px;font-size:14px}</style></head><body><h1>6. 图色素材</h1><p>素材就是 PNG 和色值, 用你顺手的截图工具做, 放进 <code>templates/</code> 即可: <code>wait_pic("xx.png")</code> / <code>find_tap("xx.png")</code> 按文件名引用。 找色类逻辑不需要素材, 直接写色值(吸管取色, 注意 BGR 序)。</p>
<p><b>同源裁材</b>: 屏幕截图的像素未必等于框架截屏的像素(后台/特殊渲染窗口)。 从 <code>logs/shots/</code> 的留痕截图裁素材——那是框架眼里的画面, 同源必配。</p></body></html>
