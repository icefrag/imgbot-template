<h1><code>wait_color_gone</code></h1>
<p>等某色消失(等击杀/等加载), 消失 True / 超时 False。</p>
<h2>原型</h2>
<pre>wait_color_gone(color, region=None, timeout=10000)</pre>

<h2>示例</h2>
<pre>ok = wait_color_gone("CC3333-282828", timeout=10000)  # 等怪死</pre>
