<h1><code>wait_color</code></h1>
<p>等某色出现(色比图快), 返回 (x, y) 或 None。偏差写进色串:</p>
<h2>原型</h2>
<pre>wait_color(color, region=None, timeout=10000)</pre>
"RRGGBB-DRDGDB"。
<h2>示例</h2>
<pre>hit = wait_color("FFD700")                    # 金币转圈 (x,y)|None</pre>
