<h1><code>wait_text</code></h1>
<p>OCR 等文字出现("完成"提示类), 返回 (中心x, 中心y, 相似度) 或 None。</p>
<h2>原型</h2>
<pre>wait_text(text, region=None, timeout=10000)</pre>

<h2>示例</h2>
<pre>hit = wait_text("挑战成功")                    # OCR 等文字 (x,y,相似度)|None</pre>
