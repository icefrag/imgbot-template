<h1><code>wait_pic_any</code></h1>
<p>等一组模板任一出现, 返回 (名字, x, y, 分数); 超时 None。</p>
<h2>原型</h2>
<pre>wait_pic_any(pics, region=None, timeout=10000, threshold=None)</pre>

<h2>示例</h2>
<pre>hit = wait_pic_any(["升级.png", "断线.png"])  # (名, x, y, 分) | None</pre>
