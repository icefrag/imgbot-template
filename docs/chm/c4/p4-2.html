<h1><code>wait_pic_gone</code></h1>
<p>等图消失(加载页结束判定)。</p>
<h2>原型</h2>
<pre>wait_pic_gone(pic, region=None, timeout=10000, threshold=None)</pre>

<h2>示例</h2>
<pre>while not wait_pic_gone("加载中.png", timeout=15000): pass</pre>
