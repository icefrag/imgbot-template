<h1><code>find_tap</code></h1>
<p>找到就拟人点。timeout=0 单帧试; 超时返 False。</p>
<h2>原型</h2>
<pre>find_tap(pic, region=None, timeout=0, threshold=None)</pre>

<h2>示例</h2>
<pre>find_tap("领取按钮.png")                        # 单帧试
find_tap("每日签到.png", timeout=5000)              # 等最多 5 秒</pre>
