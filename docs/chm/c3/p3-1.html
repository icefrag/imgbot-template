<h1><code>tap_until_gone</code></h1>
<p>连点直到图消失(确定/领取类), 返回点击次数; 不出现返回 0。</p>
<h2>原型</h2>
<pre>tap_until_gone(pic, region=None, timeout=10000, threshold=None)</pre>

<h2>示例</h2>
<pre>n = tap_until_gone("确定按钮.png")       # 返回点击次数</pre>
