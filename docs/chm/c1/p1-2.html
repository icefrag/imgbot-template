<h1><code>stopped</code></h1>
<p>F9 停止键按下过吗 —— 挂机循环的退出条件: while not stopped(): ...</p>
<h2>原型</h2>
<pre>stopped()</pre>
(sleep/等待族被叫停只是提前醒/返 None, 循环真正退出靠它)。
<h2>示例</h2>
<pre>while not stopped():               # F9 叫停了吗(挂机循环退出条件)
    打怪一轮()</pre>
</body></html>
